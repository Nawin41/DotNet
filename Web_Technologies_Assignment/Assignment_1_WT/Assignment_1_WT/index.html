<!DOCTYPE html>
<html>
<head>
    <title>HTML Assignment</title>
</head>
<body>

    <!-- 1. Largest Heading -->
    <h1>Welcome</h1>

    <!-- 2. Second Highest Heading -->
    <h2>About Us</h2>

    <!-- 3. Centered Third Heading -->
    <h3 style="text-align: center;">Welcome To HTML</h3>

    <!-- 4. Services Heading with Color -->
    <h2 style="color: #0066cc;">Services</h2>

    <!-- 5. Underlined Red Heading -->
    <h3 style="color: #ff0000;"><u>Important</u></h3>

    <!-- 6. Name Input -->
    <label>Name:</label>
    <input type="text">
    <br><br>

    <!-- 7. Password Input -->
    <label>Password:</label>
    <input type="password" placeholder="Enter your password">
    <br><br>

    <!-- 8. Checkbox -->
    <input type="checkbox" id="agree">
    <label for="agree">I Agree</label>
    <br><br>

    <!-- 9. Audio -->
    <audio controls>
        <source src="music.mp3" type="audio/mp3">
        Your browser does not support audio.
    </audio>
    <br><br>

    <!-- 10. Unordered List -->
    <ul>
        <li>Red</li>
        <li>Blue</li>
    </ul>

</body>
</html>

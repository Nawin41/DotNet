<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-3.4.1.min.js"></script>

    <script>
        $(document).ready(function ()
        {
            $("#applyBtn").click(function ()
            {
                $("div h1").css("background-color", "lightblue");
            });

        });
    </script>
</head>

<body>

    <h1>Heading Outside Div</h1>
    <h1>This will not change</h1>
    <div>
        <h2>Inside Div</h2>
        <h1>Heading inside div</h1>
        <h2>Heading inside div but in h2</h2>
    </div>
    <br>
    <button id="applyBtn">Apply Background</button>

</body>
</html>

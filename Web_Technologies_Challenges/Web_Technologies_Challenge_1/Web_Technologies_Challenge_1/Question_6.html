<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-3.4.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#getElement").click(function ()
            {
                $("li").eq(1).css("color", "yellow");
            });

        });
    </script>
</head>
<body>
    <h2>Subjects List</h2>
    <ul>
        <li>CSHARP</li>
        <li>SQL</li>
        <li>ADO</li>
    </ul>
    <br>
    <button id="getElement">Highlight Second Item</button>

</body>
</html>
